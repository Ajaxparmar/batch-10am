    <style>
        .col-6 {
            height: 600px;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=1124&q=100');
        }

        .my-bg-gradient {
        
            backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);

    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.125);

    <title>Hello, world!</title>

<body>
    <div class="container mt-5 border border-secondary rounded">

            <div class="col-6  d-flex align-items-center">
                <div class="content text-center">
                    <div class="login-form">
                        <div class="social-media mt-4">
                            <h1 class="fs-1">Sign Up</h1>
                            <div class="social-icon m-4">
                                <i class="fa-brands fa-facebook fs-1 text"></i>
                                <i class="fa-brands fa-google fs-1 text"></i>
                                <i class="fa-brands fa-linkedin fs-1 text"></i>
                            </div>
                        </div>
                        <form>
                            <input type="text" class="form-control mt-4" placeholder="enter the email">
                            <input type="password" class="form-control mt-4 " placeholder="enter the password">
                            <p>Forget password</p>
                            <button class="btn btn-danger px-4">Sign In</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-6 my-bg-gradient  d-flex align-items-center">
                <div class="content text-center ">
                    <div class="msg-group">
                        <h1>Hello, Friends</h1>
                        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Veritatis porro modi voluptatum
                            fugiat repudiandae qui inventore, ducimus, tenetur cumque nihil, fugit nulla voluptates
                            minus distinctio corrupti. Saepe cumque culpa quis?</p>
                        <button class="btn btn-outline-danger">Sign in</button>
                    </div>
                </div>
            </div>

        </div>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
