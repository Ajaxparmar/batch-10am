<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            border: 2px solid firebrick;
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(6, 1fr)
        }
        .box{
            background-color: burlywood;
            padding: 30px;
        }
        .header{
            grid-column-start: 1;
            grid-column-end: 4;
            background-color: #bbca6d;
        }
        .right-side-bar{
            grid-column-start: 4;
            grid-column-end: 7;
            grid-row-start: 1;
            grid-row-end: 3;
            background-color: #f99a24;
        }
        .left-side-bar{
            grid-column-start: 1;
            grid-column-end: 3; 
            grid-row-start: 2;
            grid-row-end: 5;
            background-color: #f3b136;
        }
        .center-box{
            background-color: #f6b7a4;
            
        }
        .dotted-box{
            grid-column-start: 3;
            grid-column-end: 5;
        }
        .left-side-bottom{
            grid-column-start: 5;
            grid-column-end: 7;
        }
        .footer{
            grid-column-start: 3;
            grid-column-end: 7; 
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box header">
            box1
        </div>
        <div class="box right-side-bar">
            box1
        </div>
        <div class="box left-side-bar">
            box1
        </div>
        <div class="box center-box">
            box1
        </div>
        <div class="box dotted-box">
            box1
        </div>
        <div class="box left-side-bottom">
            box1
        </div>

        <div class="box footer">
            box1
        </div>
        <div class="box">
            box1
        </div>
        <div class="box">
            box1
        </div>
        <div class="box">
            box1
        </div>
        <div class="box">
            box1
        </div>
        <div class="box">
            box1
        </div>
        <div class="box">
            box1
        </div>
    </div>

</body>

</html>
